<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <!-- ไอคอนเป็น SVG inline: กราฟคอนโทรล เส้นกลางเหลือง ไม่ต้องมีไฟล์รูป
         .ico เดิมเก็บไว้เป็น fallback ให้เบราว์เซอร์เก่าที่อ่าน SVG ไม่ได้ -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230B1F3A'/%3E%3Cpath d='M4 16h24' stroke='%23F5B324' stroke-width='2' stroke-dasharray='4 3'/%3E%3Cpath d='M5 21l5-7 5 4 5-9 6 6' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="alternate icon" href="%PUBLIC_URL%/blue_external_drive_backup_folder_12388.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B4FA0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- โหมดสว่าง/มืด: ตั้งก่อน CSS/React โหลด กันจอขาวแวบ · ต้องตรงกับ src/utils/theme.js (key mechaspc.theme + วิธีคำนวณ) -->
    <script>
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('mechaspc.theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <meta
      name="description"
      content="ระบบตรวจสอบคุณภาพและ control chart แผนก Mecha — Mecha Parts Lopburi 1"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MECHA SPC Realtime</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
